<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1613" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cuaderno">
  <meta name="format-detection" content="telephone=no">
  <title>Cuaderno de Canciones</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try { var t = localStorage.getItem('theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navegación principal">
    <a class="tab" href="#/canciones" data-tab="canciones"><span class="ico" data-icon="songs"></span><span>Canciones</span></a>
    <a class="tab" href="#/ideas" data-tab="ideas"><span class="ico" data-icon="ideas"></span><span>Ideas</span></a>
    <button class="rec-btn" type="button" id="rec-btn" aria-label="Grabar nota de voz"><span class="ico" data-icon="mic"></span></button>
    <a class="tab" href="#/rimas" data-tab="rimas"><span class="ico" data-icon="rhyme"></span><span>Rimas</span></a>
    <a class="tab" href="#/ajustes" data-tab="ajustes"><span class="ico" data-icon="settings"></span><span>Ajustes</span></a>
  </nav>

  <div id="overlay-root"></div>
</body>
</html>
